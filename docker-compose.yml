# Compose 编排：
#   web    —— 静态入口页 + 核验 API，宿主端口可经环境变量 WEB_PORT 配置（默认 8080）
#   verify —— 一次性验收服务：在「有效授权 / 篡改子节点引用 / 非规范 RLP」三场景下
#             穿插运行 证明内核测试、页面构建检查、对 web 的页面与健康端点 API/HTTP 冒烟，
#             执行完毕退出，退出码即验收结论（0 通过，非 0 失败）。
services:
  web:
    build: .
    image: offline-instruction-auth-review:latest
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
    ports:
      # 可配置宿主端口：WEB_PORT=9090 docker compose up web
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 12
      start_period: 2s
    restart: unless-stopped

  verify:
    build: .
    image: offline-instruction-auth-review:latest
    depends_on:
      web:
        condition: service_healthy
    environment:
      BASE_URL: "http://web:8080"
    # 两段穿插验收：
    #   1) run-all.js  —— 进程内证明核验 + 页面构建 + 内置临时 HTTP 冒烟（三场景交替）
    #   2) http-smoke.js —— 对 Compose 启动的 web 做页面/健康端点/API 的端到端冒烟
    command: ["sh", "-c", "node test/run-all.js && node test/http-smoke.js"]
    restart: "no"
